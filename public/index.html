<!doctype html>
<html lang="en" class="h-full">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TTRPG Soundboard</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<!-- Plain CSS, applied before Tailwind has generated anything, so the page never flashes white. -->
	<style>
		html { background: #0e1014; color: #e7e9ee; color-scheme: dark; }
	</style>
	<script src="/vendor/tailwindcss-browser-4.3.3.js"></script>
	<style type="text/tailwindcss">
		@theme {
			--color-surface: #0e1014;
			--color-panel: #15181e;
			--color-raised: #1d2129;
			--color-raised-hover: #262b35;
			--color-raised-dim: #191c23;
			--color-line: #2c313c;
			--color-line-dim: #20242d;
			--color-text: #e7e9ee;
			--color-muted: #8b93a3;
			--color-music: #5b8cff;
			/* An active playlist tile: the music blue at 20 % over the page, opaque, so it can sit over an image (§9.1). */
			--color-raised-music: color-mix(in srgb, var(--color-music) 20%, var(--color-surface));
			--color-sfx: #f2a541;
			/* An active sound tile, likewise: the sound amber at 15 %. */
			--color-raised-sfx: color-mix(in srgb, var(--color-sfx) 15%, var(--color-surface));
			--color-danger: #f05d5e;
			--color-boost: #ff922b;
			--color-notice: #f5d140;
			--color-host: #3fc08d;
			--color-remote: #b48cff;
			--font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
			--animate-warn: warn 0.5s ease-in-out infinite;

			/* A quick pulse between two reds, for settings that can't play out as set. */
			@keyframes warn {
				0%, 100% { background-color: var(--color-danger); }
				50% { background-color: #9e3536; }
			}
		}

		@layer base {
			body {
				@apply h-full overflow-hidden bg-surface font-sans text-text antialiased;
			}
		}
	</style>
	<script type="module" src="/app/main.js"></script>
</head>
<body>
	<div id="app" class="h-full"></div>
</body>
</html>
